<!DOCTYPE html>
<html lang="ru" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <title>Феечки СКУФинкс</title>
    <style>
        body { margin: 0; background: #fff176; font-family: sans-serif; overflow: hidden; height: 100vh; }
        .screen { display: none; height: 100%; width: 100%; flex-direction: column; align-items: center; justify-content: center; position: absolute; }
        .active { display: flex; }

        /* Дизайн */
        .title { font-size: 3rem; font-weight: 800; color: #2e7d32; margin-bottom: 20px; }
        button { padding: 15px 30px; margin: 10px; border-radius: 20px; border: none; font-size: 1.2rem; cursor: pointer; color: white; background: #ba1a1a; }
        
        /* Персонаж */
        .char-container { position: absolute; bottom: 25%; left: 10%; width: 120px; height: 250px; z-index: 2; }
        .woman-body { width: 120px; height: 180px; background: blue; border-radius: 50% 50% 20% 20%; position: absolute; bottom: 0; }
        .woman-head { width: 70px; height: 70px; background: #ffccbc; border-radius: 50%; position: absolute; top: 0; left: 25px; }
        #beer-img { position: absolute; bottom: 40%; left: 18%; width: 100px; z-index: 3; }
    </style>
</head>
<body>

<div id="menu" class="screen active">
    <div class="title" id="t1">Феечки СКУФинкс</div>
    <button class="btn-play" onclick="startGame()" id="b1">Играть</button>
    <button class="btn-settings" onclick="showScreen('settings')" id="b2">Настройки</button>
    <button onclick="toggleLang()">RU / EN</button>
</div>

<div id="settings" class="screen">
    <h2 id="t2">Настройки</h2>
    <label>Литровка: <span id="l-val">5</span>L</label>
    <input type="range" id="l-range" min="1" max="20" value="5" oninput="document.getElementById('l-val').innerText=this.value">
    <button onclick="showScreen('menu')" id="b3">Назад</button>
</div>

<div id="game" class="screen">
    <div class="char-container">
        <div class="woman-head"></div>
        <div class="woman-body"></div>
    </div>
    <img id="beer-img" src="">
</div>

<script>
    let lang = 'ru';
    function toggleLang() {
        lang = lang === 'ru' ? 'en' : 'ru';
        document.getElementById('htmlTag').lang = lang;
        document.getElementById('t1').innerText = lang === 'ru' ? 'Феечки СКУФинкс' : 'Skufinks Fairies';
        document.getElementById('b1').innerText = lang === 'ru' ? 'Играть' : 'Play';
        document.getElementById('b2').innerText = lang === 'ru' ? 'Настройки' : 'Settings';
        document.getElementById('b3').innerText = lang === 'ru' ? 'Назад' : 'Back';
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startGame() {
        showScreen('game');
        const l = document.getElementById('l-range').value;
        const img = document.getElementById('beer-img');
        
        // Логика выбора твоих картинок:
        if (l <= 5) img.src = "1.jpeg";
        else if (l <= 15) img.src = "2.jpeg";
        else img.src = "3.png";
    }
</script>
</body>
</html>
