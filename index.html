here<!DOCTYPE html>
<html lang="ru" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Феечки СКУФинкс</title>
    <style>
        body { margin: 0; background: #FFF176; font-family: sans-serif; height: 100vh; overflow: hidden; }
        .screen { display: none; height: 100%; width: 100%; flex-direction: column; align-items: center; justify-content: center; position: absolute; }
        .active { display: flex; }

        /* Кнопки */
        button { width: 200px; padding: 15px; margin: 10px; border-radius: 20px; border: none; font-size: 1rem; cursor: pointer; background: #BA1A1A; color: white; font-weight: bold; }
        
        /* Скроллбар */
        input[type=range] { width: 200px; accent-color: #BA1A1A; }

        /* Сцена */
        .stage { position: relative; width: 100%; height: 100%; }
        .sofa { position: absolute; bottom: 10%; left: 5%; width: 350px; height: 100px; background: #5D4037; border-radius: 20px; z-index: 1; }
        .char-box { position: absolute; bottom: 15%; left: 10%; width: 120px; height: 250px; z-index: 2; }
        .body { width: 120px; height: 180px; background: blue; border-radius: 50% 50% 20% 20%; position: absolute; bottom: 0; transition: background 0.3s; }
        .head { width: 70px; height: 70px; background: #FFCCBC; border-radius: 50%; position: absolute; top: 0; left: 25px; }
        
        /* Бутылка - позиционирована относительно персонажа */
        #beer-img { position: absolute; bottom: 150px; left: 80px; width: 60px; height: auto; z-index: 3; }
    </style>
</head>
<body>

<!-- МЕНЮ -->
<div id="menu" class="screen active">
    <h1 id="t-title">Феечки СКУФинкс</h1>
    <button onclick="showScreen('game')" id="t-play">Играть</button>
    <button onclick="showScreen('settings')" id="t-sett">Настройки</button>
</div>

<!-- НАСТРОЙКИ -->
<div id="settings" class="screen">
    <h2 id="t-sett2">Настройки</h2>
    <label id="t-liters">Литровка: <span id="l-val">5</span>L</label>
    <input type="range" id="l-range" min="1" max="20" value="5" oninput="document.getElementById('l-val').innerText=this.value; updateBottle()">
    <br>
    <label id="t-color">Цвет платья:</label>
    <input type="color" value="#0000FF" onchange="document.getElementById('dress-body').style.background = this.value">
    <br>
    <button onclick="toggleLang()" id="t-lang">Язык: RU/EN</button>
    <button onclick="showScreen('menu')" id="t-back">Назад</button>
</div>

<!-- ИГРА -->
<div id="game" class="screen">
    <button style="position:absolute; top:20px; left:20px; width: 100px;" onclick="location.reload()">Меню</button>
    <div class="stage">
        <div class="sofa"></div>
        <div class="char-box">
            <div class="head"></div>
            <div class="body" id="dress-body"></div>
            <img id="beer-img" src="1.jpeg" alt="пиво">
        </div>
    </div>
</div>

<script>
    const tr = {
        ru: { title: "Феечки СКУФинкс", play: "Играть", sett: "Настройки", liters: "Литровка", color: "Цвет платья", lang: "Язык: RU/EN", back: "Назад" },
        en: { title: "Skufinks Fairies", play: "Play", sett: "Settings", liters: "Litres", color: "Dress Color", lang: "Lang: RU/EN", back: "Back" }
    };
    let lang = 'ru';

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function updateBottle() {
        const l = document.getElementById('l-range').value;
        const img = document.getElementById('beer-img');
        if (l <= 5) img.src = "1.jpeg";
        else if (l <= 15) img.src = "2.jpeg";
        else img.src = "3.png";
    }

    function toggleLang() {
        lang = lang === 'ru' ? 'en' : 'ru';
        document.getElementById('t-title').innerText = tr[lang].title;
        document.getElementById('t-play').innerText = tr[lang].play;
        document.getElementById('t-sett').innerText = tr[lang].sett;
        document.getElementById('t-sett2').innerText = tr[lang].sett;
        document.getElementById('t-liters').firstChild.textContent = tr[lang].liters + ": ";
        document.getElementById('t-color').innerText = tr[lang].color;
        document.getElementById('t-lang').innerText = tr[lang].lang;
        document.getElementById('t-back').innerText = tr[lang].back;
    }
</script>
</body>
</html>
